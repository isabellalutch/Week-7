
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sky Right Now</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <h1>THE SKY RIGHT NOW</h1>
    <p>Where I am from - Oakville, Ontario.</p>
    </header>

    <main>

     <section class="sky-card" id="skyCard">

        <p class="small-title">A MOMENT IN THE SKY</p>

        <h2 id="weatherMessage">Looking at the sky...</h2>

        <div class="weather-info">
            <p id="temperature">--°C</p>
            <p id="condition">Loading weather...</p>
        </div>

            <p id="location">Oakville, Ontario</p>

    </section>

    <section class="journal">

    <h2>Today's Sky</h2>

    <p id="journalText">
        The sky is different every day.
    </p>

    <button id="refreshButton">Refresh the Sky</button>

    <p id="status"></p>

        </section>

    </main>

    <footer>
        <p>Information regarding the weather is from Open-Meteo</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
